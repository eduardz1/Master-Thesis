Marmousi2:
  type: Article
  title: "Marmousi2: An elastic upgrade for Marmousi"
  author: ["Gary S. Martin", "Robert Wiley", "Kurt J. Marfurt"]
  volume: 25
  number: 2
  page-range: 156-166
  date: 2006
  abstract: "The original Marmousi model was created by a consortium led by the Institut Français du Pétrole (IFP) in 1988. Since its creation, the model and its acoustic finite-difference synthetic data have been used by hundreds of researchers throughout the world for a multitude of geophysical purposes, and to this day remains one of the most published geophysical data sets. The advancement in computer hardware capabilities since the late 1980s has made it possible to perform a major upgrade to the model and data set, thereby extending the usefulness of the model for, hopefully, some time to come. This paper outlines the creation of an updated and upgraded Marmousi model and data set which we have named Marmousi2."
