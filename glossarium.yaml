DG:
  short: DG
  long: Discontinuous Galerkin
  plural: DGs
  description: A finite element method using discontinuous basis functions for solving partial differential equations.

STL:
  short: STL
  long: Standard Template Library
  description: A collection of template classes and functions that provide common data structures and algorithms. It allows to write in C++ using flexible and generic programming tehcniques

HDG:
  short: HDG
  long: Hybridizable Discontinuous Galerkin
  plural: HDGs
  description: A finite element method that improves efficiency by hybridizing discontinuous Galerkin formulations.

GEMM:
  short: GEMM
  long: GEneral Matrix Multiplication
  description: A fundamental linear algebra operation that computes matrix-matrix multiplication, often optimized in scientific computing and machine learning.

HAWEN:
  short: HAWEN
  long: time-HArmonic Wave modEling and iNversion
  description: A software package for time-harmonic wave modeling and inversion using hybridizable discontinuous Galerkin discretization.

SDK:
  short: SDK
  long: Software Development Kit
  description: A collection of tools, libraries, and documentation for building applications on a specific platform.

MUMPS:
  short: MUMPS
  long: MUltifrontal Massively Parallel sparse direct Solver
  description: A free and open-source, high-performance solver for large sparse linear systems using multifrontal methods.

PTX:
  short: PTX
  long: Parallel Thread Execution
  description: A virtual machine instruction set that is part of the CUDA platform from its inception and acts as a sort of assembly language for NVIDIA GPUs.

VM:
  short: VM
  long: Virtual Machine
  description: In the context of process virtual machines, like Java, they are designed to provide a way to execute programs in a platform-independent environment.

JIT:
  short: JIT
  long: Just-in-time
  description: It refers to the compilation of software during the program runtime, it is used in VMs such as the Java virtual machine to optimize on-the-fly fragments of code that are used often and in libraries such as Numba to convert to C and compile to assembly certain Python functions.

ISA:
  short: ISA
  long: Instruction Set Architecture
  description: An abstract model that defines how to directly control a processor in a family of processors (for example x86_64, ARMv7, RISC-V, ...).

LLM:
  short: LLM
  long: Large Language Model
  shortplural: LLMs
  longplural: Large Language Models
  description: An AI model trained on vast amounts of text data to understand and generate human-like language.

DOF:
  short: DOF
  long: Degrees of Freedom
  plural: Degrees of Freedom
  longplural: Degrees of Freedom
  description: Independent parameters that define the possible motions or states of a system.

GUI:
  short: GUI
  long: Graphical User Interface
  description: A visual interface that allows users to interact with software through windows, icons, and menus.

PDE:
  short: PDE
  shortplural: PDEs
  long: Partial Differential Equation
  longplural: Partial Differential Equations
  description: A mathematical equation involving multiple variables and their partial derivatives, often used to model physical systems.

FDM:
  short: FDM
  long: Finite Difference Method
  shortplural: FDMs
  longplural: Finite Difference Methods
  description: A class of numerical methods for solving differential equations by approximating derivatives trough finite differences. 

FEM:
  short: FEM
  long: Finite Element Method
  description: A popular numerical technique for approximating solution for differential equations.
  plural: FEMs
  longplural: Finite Element Methods

PREM:
  short: PREM
  long: Preliminary Reference Earth Model
  description: The Preliminary Reference Earth Model, Dziewonski and Anderson (1981), is an average Earth model that incorporates anelastic dispersion and anisotropy and therefore it is frequency-dependent and transversely isotropic for the upper mantle.

API:
  short: API
  long: Application Programming Interface
  description: A set of rules and tools that allow different software components to communicate with each other.

SEM:
  short: SEM
  long: Spectral Element Method
  description: A formulation of the finite element method that uses high-order polynomial basis functions.
  plural: SEMs
  longplural: Spectral Element Methods

HPC:
  short: HPC
  long: High-Performance Computing
  description: The use of supercomputers and parallel processing to solve complex, large-scale problems efficiently.

BLAS:
  short: BLAS
  long: Basic Linear Algebra Subprograms
  description: A specification for a set of low-level routines for common linear algebra operations such as matrix multiplication, dot products, linear combinations, etc.

SPMD:
  short: SPMD
  long: Single Program Multiple Data
  description: A parallel computing paradigm where multiple processors cooperate in the execution of a program in order to process different parts of the data simultaneously and obtain results faster.

MPI:
  short: MPI
  long: Message Passing Interface
  description: A standardized and portable message-passing system designed for parallel and distributed computing.

NCCL:
  short: NCCL
  long: NVIDIA Collective Communications Library
  description: A library that provides high-performance multi-GPU and multi-node collective communication primitives.

PDT:
  short: PDT
  long: Program Database Toolkit
  description: A framework for analyzing source. Developed by the University of Oregon, it supports several programming languages.

GPL:
  short: GPL
  long: GNU General Public License
  description: A widely used free software license that guarantees end users the freedom to run, study, share, and modify the software. It was originally written by Richard Stallman, founder of the Free Software Foundation (FSF). Any derivative work must also be distributed under the same or equivalent license terms.

APACHE:
  short: APACHEv2
  long: Apache License v2.0
  description: A permissive free software license written by the Apache Software Foundation (ASF) that allows users to use the software for any purpose, to distribute it, to modify it, and to distribute modified versions of the software under the terms of the license, without concern for royalties.

LLVM:
  short: LLVM
  description: A collection of modular and reusable compiler and toolchain technologies. The LLVM core provides target-indipendent optimizations and code generation, this is achieved by utilizing a common intermediate representation (IR).

MLIR:
  short: MLIR
  long: Multi-Level Intermediate Representation
  description: A novel appraoch to building reusable and extensible compiler infrastructure. It aims to provide a cheap way to define and introduce new abstraction levels for specific domains.

IR:
  short: IR
  long: Intermediate Representation
  description: A data structure or code used internally by a compiler or interpreter to represent source code. It is an abstraction that allows for optimizations and transformations before generating the final machine code.

SSA:
  short: SSA
  long: Static Single Assignment
  description: A property of an intermediate representation in which each variable is assigned exactly once, enabling more aggressive optimizations and simplifying the analysis of the code.

FIR:
  short: FIR
  long: Fortran Intermediate Representation
  description: An intermediate representation for Fortran code based on MLIR.

LAPACK:
  short: LAPACK
  long: Linear Algebra PACKage
  description: A software package written in Fortran 90 that provides routines for solving systems of linear equations. One of the main goals is provide an efficient implementation for shared-memory vector and parallel processors.

GPU:
  short: GPU
  shortplural: GPUs
  long: Graphics Processing Unit
  description: A specialized electronic circuit designed to accelerate the processing of images and videos. To do this, their architecture consists of a large number of smaller cores designed specifically for parallel processing, making them well-suited for tasks that can be parallelized. Nowadays GPUs are especially relevant in the field of high-performance computing (HPC) and machine learning.

CPU:
  short: CPU
  shortplural: CPUs
  long: Central Processing Unit
  description: The primary component of a computer that executes instructions and performs calculations.

FLOP:
  short: FLOP
  long: Floating Point Operation
  shortplural: FLOPs
  longplural: Floating Point Operations
  description: A single arithmetic calculation (like addition or multiplication) involving floating-point numbers.

CSR:
  short: CSR
  long: Compressed Sparse Row
  description: A sparse matrix storage format that stores the non-zero elements of a matrix in a one-dimensional array, along with two additional arrays that store the row indices and offsets for each row for the non-zero elements. This format is particularly efficient for matrix-vector multiplication and is widely used in scientific computing.

COO:
  short: COO
  long: Coordinate List
  description: "A sparse matrix storage format that stores the non-zero elements of a matrix in three separate arrays: one for the row indices, one for the column indices, and one for the values of the non-zero elements. This format is particularly useful for constructing sparse matrices incrementally."

SIMD:
  short: SIMD
  long: Single Instruction Multiple Data
  description: A parallel computing architecture that allows a single instruction to be applied to multiple data points simultaneously. This is particularly useful for vectorized operations, where the same operation is applied to multiple elements of a vector or array.

SIMT:
  short: SIMT
  long: Single Intruction Multiple Threads
  description: An execution model used in parallel computing where a single control unit broadcasts an instruction to multiple compute units.
  
GCC:
  short: GCC
  long: GNU Compiler Collection
  desription: An open-source suite of compilers for multiple programming languages, originally developed for C.

IO:
  short: I/O
  long: Input/Output
  description: The communication of data between a computer and external devices or systems.
